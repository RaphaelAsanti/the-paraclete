name: IndexNow Submission

on:
  push:
    paths:
      - '**/*.html'

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run IndexNow script
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: bash indexnow.sh
